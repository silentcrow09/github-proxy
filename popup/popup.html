<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>GitHub 加速链接</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img src="../icons/icon32.png" alt="" class="logo" width="24" height="24">
    <div class="title">
      <h1>GitHub 加速</h1>
      <p class="subtitle">Release 下载 / clone 自动加速</p>
    </div>
  </header>

  <main class="main">
    <!-- 当前生效镜像状态条 -->
    <div class="status-bar" id="statusBar" data-state="idle">
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-main" id="statusMain">正在探测镜像…</span>
    </div>
    <p class="status-warn" id="statusWarn" hidden></p>

    <label class="switch-row">
      <span class="switch-text">
        <strong>启用加速</strong>
        <small>关闭后页面链接保持原样</small>
      </span>
      <span class="switch">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </span>
    </label>

    <label class="switch-row">
      <span class="switch-text">
        <strong>增强模式</strong>
        <small>改写页面中所有 GitHub 仓库链接</small>
      </span>
      <span class="switch">
        <input type="checkbox" id="enhanced">
        <span class="slider"></span>
      </span>
    </label>

    <div class="section-head">
      <span class="section-title">镜像列表</span>
      <span class="section-hint" id="status">测速中…</span>
    </div>
    <div id="proxies" class="proxy-list"></div>

    <button id="retest" class="btn btn-secondary">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 2a5.99 5.99 0 0 0-4.95 2.6L1.5 3.5v4h4L3.9 5.9A4.5 4.5 0 1 1 3.5 8H2a6 6 0 1 0 6-6z"/></svg>
      重新测速
    </button>
  </main>

  <footer class="footer">
    <button id="settings" class="btn btn-link">管理加速地址</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
